kind = "web"
previewPath = "/"
title = "Subhash Maurya Portfolio"
description = "A distinctive personal portfolio for Subhash Maurya, an Android and full-stack developer, showcasing professional experience, production projects, technical skills, and contact details with a dual light and dark theme."
version = "1.0.0"
id = "artifacts/subhash-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21855

[services.development]
run = "pnpm --filter @workspace/subhash-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/subhash-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/subhash-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21855"
BASE_PATH = "/"
